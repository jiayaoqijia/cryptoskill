name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit test suite
        run: pytest -v
