  "/mcp/tools/get_top_subgraph_deployments":
    post:
      operationId: "tool_get_top_subgraph_deployments"
      summary: "Find subgraphs whose crawled manifest indexes a given contract on a given chain."
      description: "Find subgraphs whose crawled manifest indexes a given contract on a given chain. Official subgraph-MCP name, better ranking: reliability_score then real query_volume_30d, not query fees and not the official 0-count oracle. contract_addresses come from subgraph.yaml dataSources/templates at crawl time — coverage is high for EVM subgraphs, empty for most substreams-powered ones. Does not query the gateway. Default 3 results, matching official."
      tags:
        - "mcp-tools"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              additionalProperties: false
              properties:
                contract_address:
                  type: "string"
                  description: "EVM contract address (0x-prefixed 40 hex)"
                chain:
                  type: "string"
                  description: "Official subgraph-MCP uses graph-node ids here (`mainnet`, not `ethereum`). We accept both; aliases resolve (ethereum→mainnet, arbitrum→arbitrum-one, polygon→matic)."
                limit:
                  type: "integer"
                  description: "Max results (default 3, max 20)"
                  default: 3
              required:
                - "contract_address"
                - "chain"
      responses:
        "200":
          description: "Tool result (JSON-encoded)"
          content:
            application/json:
              schema:
                type: "object"
        "400":
          description: "Invalid input"
