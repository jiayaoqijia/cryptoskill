interface:
  display_name: "AssetFare Route"
  short_description: "Quote-bound bridge and agent-wallet funding routes."
  default_prompt: "Use $assetfare-route to compare an AssetFare candidate across eight chains, including a read-only agent or x402 payment-wallet funding quote only when the caller knows a spendable source asset and target rail. Never inspect balances or auto-react to a 402. Require direct_route_summary and continuation_v3; verify the full-quote hash, ordered providers, bounds, wallet/signer requirements, TTL, dated non-enforcing economic_guidance, and no-sign/no-submit flags. Guidance never blocks an amount or supplies a market ranking. Keep selection_status=unranked_candidate unless a separate explicit assetfare-select operation chooses an allowed mode and non-weaker bounds. caller_approved:true is not human proof and must never be auto-inserted. Multi-step routes are session-only. Stop before signing or submission."
