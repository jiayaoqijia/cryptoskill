name: Release package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Package the tagged release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/package_release.py --output dist --tag "$RELEASE_TAG"
      - name: Validate the extracted package
        run: |
          python -m zipfile -e dist/market-brief-*.zip /tmp/market-brief-package
          python /tmp/market-brief-package/market-brief/scripts/check.py
          git diff --exit-code
      - name: Upload the skill ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/market-brief-*.zip dist/SHA256SUMS
