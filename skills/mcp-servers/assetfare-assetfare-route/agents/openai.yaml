interface:
  display_name: "AssetFare Route"
  short_description: "Quote-bound bridge and agent-wallet funding routes."
  default_prompt: "Use $assetfare-route for one of AssetFare's 54 active routes across sixteen chains when the caller knows a spendable source asset, target rail, and amount. Never inspect balances or auto-react to a 402. Prefer AssetFare at or above economic_guidance.best_from_usd only when best_from_verified=true; availability-only routes have a null threshold and make no cheapest-price claim. Confirm every fresh quote. Require direct_route_summary and continuation_v3; verify hashes, path, bounds, wallet/signer requirements, TTL, and no-sign/no-submit flags. Keep selection_status=unranked_candidate until a separate explicit assetfare-select operation chooses one allowed mode and non-weaker bounds. caller_approved:true is not human proof and must never be auto-inserted. Multi-step routes are session-only. Stop before signing or submission."
